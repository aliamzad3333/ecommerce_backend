name: Deploy to Server

# Auto-deployment workflow for ecommerce backend
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[test]') || contains(github.event.head_commit.message, '[run-tests]')
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Build
      run: go build -v ./...
    
    - name: Test
      run: go test -v ./...

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Build Go application
      run: |
        go mod download
        go build -o ecommerce-backend main.go
    
    - name: Test SSH connection
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          echo "✅ SSH connection successful"
          echo "Server: $(hostname)"
          echo "Date: $(date)"
    
    - name: Prepare server for deployment
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          # Create directory if it doesn't exist
          sudo mkdir -p /www/wwwroot/ecommerce-backend
          sudo mkdir -p /tmp/ecommerce-deploy
          
          # Stop the service BEFORE uploading to avoid "Text file busy" error
          echo "Stopping ecommerce-backend service..."
          sudo systemctl stop ecommerce-backend || true
          
          # Wait a moment for the process to fully stop
          sleep 2
          
          # Verify the service is stopped
          if systemctl is-active --quiet ecommerce-backend; then
            echo "⚠️ Service still running, forcing stop..."
            sudo pkill -9 ecommerce-backend || true
            sleep 1
          fi
          
          echo "✅ Service stopped, ready for deployment"
    
    - name: Upload binary to temporary location
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        source: "ecommerce-backend"
        target: "/tmp/ecommerce-deploy/"
        strip_components: 0
        timeout: 60s
        command_timeout: 60s
        debug: true
        overwrite: true
    
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          # Suppress hostname warning (harmless)
          export DEBIAN_FRONTEND=noninteractive
          
          # Ensure service is stopped
          sudo systemctl stop ecommerce-backend || true
          sleep 1
          
          # Backup existing binary if it exists
          if [ -f /www/wwwroot/ecommerce-backend/ecommerce-backend ]; then
            echo "Backing up existing binary..."
            sudo mv /www/wwwroot/ecommerce-backend/ecommerce-backend /www/wwwroot/ecommerce-backend/ecommerce-backend.backup.$(date +%Y%m%d_%H%M%S) || true
          fi
          
          # Move new binary from temp location to final location
          if [ -f /tmp/ecommerce-deploy/ecommerce-backend ]; then
            echo "Moving new binary to deployment directory..."
            sudo mv /tmp/ecommerce-deploy/ecommerce-backend /www/wwwroot/ecommerce-backend/ecommerce-backend
            echo "✅ Binary moved successfully"
          else
            echo "❌ ERROR: Binary not found in temp location"
            ls -la /tmp/ecommerce-deploy/ || echo "Temp directory listing failed"
            exit 1
          fi
          
          # Verify binary exists and check size
          if [ ! -f /www/wwwroot/ecommerce-backend/ecommerce-backend ]; then
            echo "❌ ERROR: Binary file not found after move"
            exit 1
          fi
          
          FILE_SIZE=$(stat -f%z /www/wwwroot/ecommerce-backend/ecommerce-backend 2>/dev/null || stat -c%s /www/wwwroot/ecommerce-backend/ecommerce-backend 2>/dev/null || echo "0")
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "⚠️ WARNING: File size is suspiciously small ($FILE_SIZE bytes). Expected > 1MB for binary."
          else
            echo "✅ Binary file verified (size: $FILE_SIZE bytes)"
          fi
          
          # Set permissions
          echo "Setting permissions..."
          sudo chmod +x /www/wwwroot/ecommerce-backend/ecommerce-backend
          sudo chown www:www /www/wwwroot/ecommerce-backend/ecommerce-backend
          
          # Clean up temp directory
          sudo rm -rf /tmp/ecommerce-deploy
          
          # Clean up any leftover directories from previous failed deployments
          sudo rm -rf /www/wwwroot/ecommerce-backend/ecommerce-backend.new || true
          
          echo "✅ Binary is ready"
          
          # PERMANENT FIX: Ensure uploads directory exists with proper permissions
          # This directory MUST persist across deployments for images to work
          echo "Setting up uploads directory (permanent fix)..."
          
          # Create directories (preserve existing files)
          sudo mkdir -p /www/wwwroot/ecommerce-backend/uploads/products
          sudo mkdir -p /www/wwwroot/ecommerce-backend/uploads/slider
          
          # Set ownership to www:www (matches service user)
          # This allows the service to write files and nginx to read them
          sudo chown -R www:www /www/wwwroot/ecommerce-backend/uploads
          
          # Set directory permissions (755 = owner can write, others can read/execute)
          sudo find /www/wwwroot/ecommerce-backend/uploads -type d -exec chmod 755 {} \;
          
          # Set file permissions (644 = owner can write, others can read)
          sudo find /www/wwwroot/ecommerce-backend/uploads -type f -exec chmod 644 {} \;
          
          # Ensure parent directories are traversable
          sudo chmod 755 /www/wwwroot 2>/dev/null || true
          sudo chmod 755 /www/wwwroot/ecommerce-backend 2>/dev/null || true
          sudo chmod 755 /www/wwwroot/ecommerce-backend/uploads 2>/dev/null || true
          
          # Verify directory exists and is writable
          if [ ! -d /www/wwwroot/ecommerce-backend/uploads/products ]; then
            echo "❌ ERROR: uploads/products directory not created"
            exit 1
          fi
          
          if [ ! -d /www/wwwroot/ecommerce-backend/uploads/slider ]; then
            echo "❌ ERROR: uploads/slider directory not created"
            exit 1
          fi
          
          # Test write permissions
          if sudo -u www touch /www/wwwroot/ecommerce-backend/uploads/products/.test 2>/dev/null; then
            sudo rm -f /www/wwwroot/ecommerce-backend/uploads/products/.test
            echo "✅ Upload directory is writable by service user"
          else
            echo "⚠️ WARNING: Upload directory may not be writable by service user"
          fi
          
          echo "✅ Upload directory setup complete (permanent fix applied)"
          
          # Restart the service (restart handles stop+start better)
          sudo systemctl restart ecommerce-backend
          sudo systemctl enable ecommerce-backend
          
          # Wait for service to fully start
          sleep 3
          
          # Check service status
          sudo systemctl is-active ecommerce-backend || {
            echo "Service failed to start. Checking logs:"
            sudo journalctl -u ecommerce-backend -n 20 --no-pager
            exit 1
          }
          
          # Test the API with retries
          for i in {1..5}; do
            sleep 2
            if curl -f http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ Health check passed"
              break
            fi
            echo "Attempt $i: Health check failed, retrying..."
          done
          
          # Verify uploads directory still exists and is accessible after restart
          echo "Verifying uploads directory after service restart..."
          if [ -d /www/wwwroot/ecommerce-backend/uploads/products ] && [ -d /www/wwwroot/ecommerce-backend/uploads/slider ]; then
            echo "✅ Uploads directories verified after restart"
          else
            echo "⚠️ WARNING: Uploads directories missing after restart - application will recreate them"
          fi
          
          # Final status check
          sudo systemctl status ecommerce-backend --no-pager -l
          
          echo ""
          echo "🎉 Deployment complete!"
          echo "📁 Uploads directory: /www/wwwroot/ecommerce-backend/uploads"
          echo "✅ Images should now be accessible at /uploads/products/ and /uploads/slider/"
